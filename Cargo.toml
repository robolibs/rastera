[package]
name = "rastera"
version = "0.1.2"
edition = "2024"
description = "Rust GeoTIFF and raster library translated from rastkit"
license = "MIT"
readme = "README.md"
publish = false
include = [
    "Cargo.toml",
    "pyproject.toml",
    "README.md",
    "PLAN.md",
    "include/**/*.h",
    "src/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
]

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]
python-extension = ["python"]

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
concord = { git = "https://codeberg.org/robolibs/concord.git", tag = "0.1.2" }
datapod = { git = "https://codeberg.org/robolibs/datapod.git", tag = "0.4.1" }
pyo3 = { version = "0.23", optional = true, features = [
    "abi3-py39",
    "extension-module",
] }
rgb = { version = "0.8", features = ["bytemuck"] }
thiserror = "2.0"
