[package]
name = "rastera"
version = "0.0.1"
edition = "2024"
description = "Rust GeoTIFF and raster library translated from rastkit"
license = "MIT"
readme = "README.md"
publish = false
include = [
    "Cargo.toml",
    "README.md",
    "PLAN.md",
    "src/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
]

[lib]
path = "src/lib.rs"

[dependencies]
concord = { git = "https://codeberg.org/robolibs/concord.git" }
datapod = { git = "https://codeberg.org/robolibs/datapod.git" }
rgb = "0.8"
thiserror = "2.0"
