[package]
name = "rastera"
version = "0.0.1"
edition = "2024"
description = "Rust GeoTIFF and raster library translated from rastkit"
license = "MIT"
readme = "README.md"
publish = false
include = [
    "Cargo.toml",
    "pyproject.toml",
    "README.md",
    "PLAN.md",
    "include/**/*.h",
    "src/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
]

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3", "pyo3/abi3-py39", "pyo3/auto-initialize"]
python-extension = ["python", "pyo3/extension-module"]

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
concord = { git = "https://codeberg.org/robolibs/concord.git", rev = "34062145237c2f2e19cb62e50eba127b4bc848b5" }
datapod = { git = "https://codeberg.org/robolibs/datapod.git", rev = "4547e328826fb4fd788b7acac29c2f70efc62746" }
pyo3 = { version = "0.23", optional = true }
rgb = { version = "0.8", features = ["bytemuck"] }
thiserror = "2.0"
